{% extends "base.html" %}

{% block content %}

        <h1>My Projects</h1>
    {% for project in projects%}
        <article class="project-card">

            <img
                src="{{ url_for('static', filename='images/' ~ project['image']) }}"
                alt="Screenshot of {{ project['title'] }}"
            >
            
            <h2>{{ project["title"] }}</h2>
            <p>{{project["description"]}}</p>
            <a href="{{ project['github'] }}" target="_blank">
                View on GitHub
            </a>
        </article>
    {% endfor %}

{% endblock %}
