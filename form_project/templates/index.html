<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فرم ثبت علاقه‌مندی‌ها</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <main class="container py-5">
        <h1 class="h3 mb-4">فرم ثبت علاقه‌مندی‌ها</h1>

        <div class="card shadow-sm mb-4">
            <div class="card-body p-4">
                <form method="post">

                    <div class="mb-3">
                        <label for="name" class="form-label">نام:</label>
                        <input type="text" class="form-control"
                               id="name" name="name" required>
                    </div>

                    <div class="mb-3">
                        <label for="age" class="form-label">سن:</label>
                        <input type="number" class="form-control"
                               id="age" name="age" required>
                    </div>

                    <div class="mb-3">
                        <label for="interest" class="form-label">علاقه‌مندی:</label>
                        <input type="text" class="form-control"
                               id="interest" name="interest" required>
                    </div>

                    <div class="mb-3">
                        <label for="interest_level" class="form-label">
                            میزان علاقه (۱ تا ۱۰):
                        </label>
                        <input type="number" class="form-control"
                               id="interest_level" name="interest_level"
                               min="1" max="10" required>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">
                            توضیحات اضافی:
                        </label>
                        <textarea class="form-control" id="description"
                                  name="description" rows="4"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        ثبت اطلاعات
                    </button>

                </form>
            </div>
        </div>

        <h2 class="h4 mb-3">اطلاعات ثبت‌شده</h2>

        <div class="table-responsive">
            <table class="table table-striped table-bordered align-middle">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">نام</th>
                        <th scope="col">سن</th>
                        <th scope="col">علاقه‌مندی</th>
                        <th scope="col">میزان علاقه</th>
                        <th scope="col">توضیحات اضافی</th>
                    </tr>
                </thead>
                <tbody>
                    {% for record in records %}
                        <tr>
                            <td>{{ record["name"] }}</td>
                            <td>{{ record["age"] }}</td>
                            <td>{{ record["interest"] }}</td>
                            <td>{{ record["interest_level"] }}</td>
                            <td>{{ record["description"] }}</td>
                        </tr>
                    {% else %}
                        <tr>
                            <td colspan="5" class="text-center text-muted py-4">
                                هنوز اطلاعاتی ثبت نشده است.
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </main>

</body>
</html>
